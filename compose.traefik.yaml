# Traefik deployment — requires an external Docker network named "traefik"
# with a websecure entrypoint and a letsencrypt cert resolver already running
# on this host.
# cp .env.example .env   # uncomment: COMPOSE_FILE=compose.traefik.yaml
# docker compose up -d
services:
  mspolycalc:
    image: ghcr.io/cheminfo/mspolycalc:latest
    build: .
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      # Canonical router: serve the app on www.polycalc.org
      - 'traefik.http.routers.mspolycalc.rule=Host(`www.polycalc.org`)'
      - 'traefik.http.routers.mspolycalc.entrypoints=websecure'
      - 'traefik.http.routers.mspolycalc.tls=true'
      - 'traefik.http.routers.mspolycalc.tls.certresolver=letsencrypt'
      - 'traefik.http.services.mspolycalc.loadbalancer.server.port=80'
      # Redirect router: 301 the apex to the canonical name so the same page is
      # not served under two names.
      - 'traefik.http.routers.mspolycalc-alt.rule=Host(`polycalc.org`)'
      - 'traefik.http.routers.mspolycalc-alt.entrypoints=websecure'
      - 'traefik.http.routers.mspolycalc-alt.tls=true'
      - 'traefik.http.routers.mspolycalc-alt.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.mspolycalc-alt.middlewares=mspolycalc-to-canonical'
      - 'traefik.http.middlewares.mspolycalc-to-canonical.redirectregex.regex=^https?://[^/]+/(.*)'
      - 'traefik.http.middlewares.mspolycalc-to-canonical.redirectregex.replacement=https://www.polycalc.org/$${1}'
      - 'traefik.http.middlewares.mspolycalc-to-canonical.redirectregex.permanent=true'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  traefik:
    external: true
